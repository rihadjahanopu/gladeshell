# Cargo Audit Configuration
# Advisories acknowledged and suppressed with justification.

[advisories]

# RUSTSEC-2026-0245 / RUSTSEC-2026-0246 — sevenz-rust: path traversal + unmaintained
# Justification: gladeshell implements its own sanitize_extract_path() which validates
# all archive entry paths against the destination directory before any write.
# The CVE requires a maliciously crafted .7z archive; our sanitizer prevents zip-slip.
# Tracked for migration to sevenz-rust2 once its public API stabilises.
# RUSTSEC-2026-0543 — chrono: unmaintained notice
# Justification: chrono has an informational unmaintained notice on rustsec.
# gladeshell uses jiff for modern, safe time/date operations; chrono is only a transitive dep if pulled by sub-crates.
# RUSTSEC-2026-0574..RUSTSEC-2026-0582 — heapless 0.8.0: unsoundness advisories (2026-11-18)
# Justification: heapless 0.8.0 appears in Cargo.lock only via gix -> gix-hash/gix-packetline ->
# faster-hex 0.10.1 ([target.'cfg(not(feature = "alloc"))'.dependencies.heapless]).
# Both gix-hash and gix-packetline enable faster-hex's `std` (`alloc`) feature, and faster-hex
# only imports heapless::{String, Vec} under #[cfg(not(feature = "alloc"))], so none of the
# affected heapless data structures are used in gladeshell. Awaiting upstream gix/faster-hex bump.
ignore = [
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0245",
    "RUSTSEC-2026-0246",
