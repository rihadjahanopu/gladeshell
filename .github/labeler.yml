# Auto-label rules for gladeshell pull requests
# Official Docs: https://github.com/actions/labeler

# ── 1. Rust Core Engine ────────────────────────────────────────
rust:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*.rs'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'aliases.toml'

# ── 2. Native Tools & Ratatui TUI Apps ─────────────────────────
tools-tui:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/tools/**/*.rs'

# ── 3. Shell Init & Auto-Completions Engine ────────────────────
shell-init:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/init/**/*.rs'
          - 'src/plugins/**/*.rs'

# ── 4. Cryptographic Vault & Security ──────────────────────────
security:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/tools/vault.rs'
          - 'SECURITY.md'
          - 'LICENSE'

# ── 5. Shell & PowerShell Installers ───────────────────────────
installer:
  - changed-files:
      - any-glob-to-any-file:
          - 'install.sh'
          - 'install.ps1'
          - 'setup.sh'
          - 'setup.ps1'
          - 'setup.fish'
          - 'setup.zsh'

# ── 6. Web Portal & Static Site ────────────────────────────────
website:
  - changed-files:
      - any-glob-to-any-file:
          - 'web/**'

# ── 7. Documentation & Project Specs ──────────────────────────
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - '*.txt'
          - 'ARCHITECTURE.txt'
          - 'ROADMAP.md'
          - 'CHANGELOG.md'
          - 'SUPPORT.md'

# ── 8. Performance Micro-Benchmarks ───────────────────────────
benchmarks:
  - changed-files:
      - any-glob-to-any-file:
          - 'benches/**'
          - 'benchmark.md'

# ── 9. CI / CD & Git Hygiene Hooks ─────────────────────────────
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.githooks/**'
          - 'Makefile'
