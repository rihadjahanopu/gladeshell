# Auto-label rules for gladeshell pull requests
# Docs: https://github.com/actions/labeler

# ── Rust Core Engine ───────────────────────────────────────────
rust:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*.rs'
          - 'benches/**/*.rs'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'aliases.toml'

# ── Shell & PowerShell Installers ─────────────────────────────
installer:
  - changed-files:
      - any-glob-to-any-file:
          - 'install.sh'
          - 'install.ps1'

# ── Website / Documentation Site ──────────────────────────────
website:
  - changed-files:
      - any-glob-to-any-file:
          - 'web/**'

# ── Documentation & Architecture Specs ─────────────────────────
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - '*.txt'
          - 'wiki.md'
          - 'ARCHITECTURE.txt'

# ── Performance Benchmarks ────────────────────────────────────
benchmarks:
  - changed-files:
      - any-glob-to-any-file:
          - 'benches/**'
          - 'benchmark.md'

# ── CI / CD & Git Hooks ────────────────────────────────────────
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.githooks/**'
          - 'Makefile'
