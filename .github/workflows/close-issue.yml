name: Close Issue on Slash Command

on:
  issue_comment:
    types: [created]

concurrency:
  group: close-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  close-issue:
    name: Close Issue
    if: |
      !github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/close') || contains(github.event.comment.body, '/resolved')) &&
      (github.event.comment.user.login == github.event.issue.user.login || contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Close Issue via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --comment "🔒 Closed automatically by authorized bot command (`/close` / `/resolved`)."
