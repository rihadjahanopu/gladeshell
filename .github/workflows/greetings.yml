name: Contributor Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

concurrency:
  group: greetings-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 **Welcome to fancybash!** Thank you for opening your first issue!

            ⚡ **fancybash** is a hyper-optimized pure Rust CLI toolkit built for ultra-fast terminal workflows.

            To help us triage and resolve your issue quickly, please ensure you've provided:
            - **Operating System & Architecture**: (e.g. Ubuntu 24.04 x86_64, macOS M3 arm64, Windows 11)
            - **Fancybash Version**: Output of `fancybash --version`
            - **Cargo & Rust Toolchain**: Output of `rustc --version`
            - **Steps to reproduce & panic backtrace** (if applicable)

            Made with ❤️ in Bangladesh 🇧🇩
          pr-message: |
            🎉 **Thank you for your first Pull Request to fancybash!**

            Before review, please verify:
            - [ ] `cargo check --workspace --all-targets` compiles without errors
            - [ ] `cargo clippy --workspace --all-targets -- -D warnings` has 0 warnings
            - [ ] `cargo test --workspace` passes all unit tests
            - [ ] You have updated `CHANGELOG.md` under `[Unreleased]` for user-facing changes

            A maintainer will review your pull request shortly! ⚡
