name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross for Linux AArch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary (Release)
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package release archive & raw binary
        shell: bash
        run: |
          STAGE_DIR="fancybash-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN_PATH="target/${{ matrix.target }}/release/fancybash.exe"
            [ ! -f "$BIN_PATH" ] && BIN_PATH="target/release/fancybash.exe"
            cp "$BIN_PATH" "$STAGE_DIR/"
            cp "$BIN_PATH" "fancybash-${{ matrix.target }}.exe"
            
            if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
              cp "$BIN_PATH" "fancybash-windows-arm64.exe"
              sha256sum "fancybash-windows-arm64.exe" > "fancybash-windows-arm64.exe.sha256" 2>/dev/null || true
            else
              cp "$BIN_PATH" "fancybash-windows-amd64.exe"
              cp "$BIN_PATH" "fancybash.exe"
              sha256sum "fancybash-windows-amd64.exe" > "fancybash-windows-amd64.exe.sha256" 2>/dev/null || true
            fi

            cp README.md LICENSE "$STAGE_DIR/" 2>/dev/null || true
            7z a "${STAGE_DIR}.zip" "./${STAGE_DIR}/*"
          else
            BIN_PATH="target/${{ matrix.target }}/release/fancybash"
            [ ! -f "$BIN_PATH" ] && BIN_PATH="target/release/fancybash"
            cp "$BIN_PATH" "$STAGE_DIR/"
            cp "$BIN_PATH" "fancybash-${{ matrix.target }}"

            case "${{ matrix.target }}" in
              x86_64-unknown-linux-gnu)
                cp "$BIN_PATH" "fancybash-linux-amd64"
                cp "$BIN_PATH" "fancybash-linux-amd64-baseline"
                ;;
              x86_64-unknown-linux-musl)
                cp "$BIN_PATH" "fancybash-linux-musl"
                cp "$BIN_PATH" "fancybash-linux-amd64-musl"
                ;;
              aarch64-unknown-linux-gnu)
                cp "$BIN_PATH" "fancybash-linux-arm64"
                ;;
              x86_64-apple-darwin)
                cp "$BIN_PATH" "fancybash-darwin-amd64"
                cp "$BIN_PATH" "fancybash-darwin-amd64-baseline"
                ;;
              aarch64-apple-darwin)
                cp "$BIN_PATH" "fancybash-darwin-arm64"
                ;;
            esac

            cp README.md LICENSE "$STAGE_DIR/" 2>/dev/null || true
            tar -czf "${STAGE_DIR}.tar.gz" -C "$STAGE_DIR" fancybash README.md LICENSE 2>/dev/null || tar -czf "${STAGE_DIR}.tar.gz" -C "$STAGE_DIR" fancybash
            sha256sum "fancybash-${{ matrix.target }}" > "fancybash-${{ matrix.target }}.sha256" 2>/dev/null || true
          fi

      - name: Generate Combined SHA256SUMS Manifest
        shell: bash
        run: |
          sha256sum fancybash* 2>/dev/null > SHA256SUMS.txt || true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          generate_release_notes: true
          files: |
            fancybash-*
            SHA256SUMS.txt
