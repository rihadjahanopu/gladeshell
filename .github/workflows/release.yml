name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: fancybash-linux-amd64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: fancybash-linux-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: fancybash-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: fancybash-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: fancybash-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: fancybash-windows-amd64.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            asset_name: fancybash-windows-arm64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Swatinem Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl dependencies (Linux MUSL)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross tool (Linux AArch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package binary & release archive
        shell: bash
        run: |
          STAGE_DIR="fancybash-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN_PATH="target/${{ matrix.target }}/release/fancybash.exe"
            [ ! -f "$BIN_PATH" ] && BIN_PATH="target/release/fancybash.exe"

            cp "$BIN_PATH" "$STAGE_DIR/"
            cp "$BIN_PATH" "${{ matrix.asset_name }}"
            cp README.md LICENSE "$STAGE_DIR/" 2>/dev/null || true
            7z a "${STAGE_DIR}.zip" "./${STAGE_DIR}/*"
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            BIN_PATH="target/${{ matrix.target }}/release/fancybash"
            [ ! -f "$BIN_PATH" ] && BIN_PATH="target/release/fancybash"

            cp "$BIN_PATH" "$STAGE_DIR/"
            cp "$BIN_PATH" "${{ matrix.asset_name }}"
            cp README.md LICENSE "$STAGE_DIR/" 2>/dev/null || true
            tar -czf "${STAGE_DIR}.tar.gz" -C "$STAGE_DIR" fancybash README.md LICENSE 2>/dev/null || tar -czf "${STAGE_DIR}.tar.gz" -C "$STAGE_DIR" fancybash
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi

      - name: Generate Combined SHA256SUMS Manifest
        shell: bash
        run: |
          sha256sum fancybash-* 2>/dev/null > SHA256SUMS-${{ matrix.target }}.txt || true

      - name: Publish Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          generate_release_notes: true
          files: |
            fancybash-*
            SHA256SUMS-*.txt
