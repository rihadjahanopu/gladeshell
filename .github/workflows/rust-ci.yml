name: Rust CI Pipeline

on:
  push:
    branches: ['main', 'dev', 'feat/*', 'fix/*']
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "aliases.toml"
  pull_request:
    branches: ['main']
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "aliases.toml"
      - ".github/workflows/rust-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-lint:
    name: Code Formatting & Clippy Lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Swatinem Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy lints (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Security Audit (cargo-audit)
        uses: rustsec/audit-check@v2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  matrix-test:
    name: Test Suite (${{ matrix.os }})
    needs: check-and-lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Swatinem Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Verify compilation (all features)
        run: cargo check --workspace --all-targets --all-features

      - name: Execute unit & integration tests
        run: cargo test --workspace --all-targets --all-features

      - name: Verify documentation generation (no warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --all-features
