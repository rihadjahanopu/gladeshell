name: ShellCheck Installer Validation

on:
  push:
    branches: ['main', 'dev']
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    branches: ['main']
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Lint Installer Shell Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on Bash installer scripts
        run: |
          echo "🔍 Checking install.sh and web/install.sh..."
          mapfile -t BASH_FILES < <(git ls-files '*.sh')
          if [ ${#BASH_FILES[@]} -gt 0 ]; then
            shellcheck --severity=warning "${BASH_FILES[@]}"
            echo "✅ All ${#BASH_FILES[@]} Bash installer script(s) passed ShellCheck cleanly."
          else
            echo "ℹ️ No .sh files found to check."
          fi
