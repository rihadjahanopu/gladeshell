name: Script Linter & Installer Security Validation

on:
  push:
    branches: ['main', 'dev']
    paths:
      - "**.sh"
      - "**.ps1"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    branches: ['main']
    paths:
      - "**.sh"
      - "**.ps1"
      - ".github/workflows/shellcheck.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck (Bash Installers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on Bash installer scripts
        run: |
          echo "🔍 Checking install.sh and web/install.sh..."
          mapfile -t BASH_FILES < <(git ls-files '*.sh')
          if [ ${#BASH_FILES[@]} -gt 0 ]; then
            shellcheck --severity=warning "${BASH_FILES[@]}"
            echo "✅ All ${#BASH_FILES[@]} Bash installer script(s) passed ShellCheck cleanly."
          else
            echo "ℹ️ No .sh files found to check."
          fi

  psscriptanalyzer:
    name: PSScriptAnalyzer (PowerShell Installers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint PowerShell scripts with PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $psFiles = Get-ChildItem -Recurse -Filter "*.ps1"
          foreach ($file in $psFiles) {
              Write-Host "🔍 Analyzing $($file.FullName)..."
              $results = Invoke-ScriptAnalyzer -Path $file.FullName -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost, PSUseBOMForUnicodeEncodedFile
              if ($results) {
                  $results | Format-Table -AutoSize
                  throw "PSScriptAnalyzer found issues in $($file.Name)"
              } else {
                  Write-Host "✅ $($file.Name) passed PSScriptAnalyzer cleanly."
              }
          }
