[package]
name = "fancybash"
version = "0.1.0"
edition = "2021"
authors = ["Rihad Jahan Opu <rihadjahanopu@example.com>"]
description = "Ultra-high-performance modular shell environment and prompt kit"
license = "MIT"
repository = "https://github.com/rihadjahanopu/fancybash"
readme = "README.md"
keywords = ["shell", "prompt", "zsh", "bash", "fish"]
categories = ["command-line-utilities"]

# ── Crate Targets ────────────────────────────────────────────────────────────
# 1. Native binary  →  `fancybash` CLI (init, uup, uu, gen, ex, sysmon, ftop, …)
[[bin]]
name = "fancybash"
path = "src/main.rs"

# 3. C-ABI dynamic library  →  loaded in-process by the shell (zero-fork prompt)
[lib]
name = "fancybash_core"
crate-type = ["cdylib", "rlib"]   # rlib keeps unit-tests functional
path = "src/lib.rs"

# ── Dependencies ─────────────────────────────────────────────────────────────
[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env", "string"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0"
toml = "0.8"

# Async runtime (optional, not needed for the daemon which uses std threads)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"], optional = true }

# Git internals – gitoxide & git2 (zero-fork, pure Rust)
git2 = { version = "0.21", default-features = false, optional = true }

gix = { version = "0.66", default-features = false, features = [
    "revision",
    "max-performance-safe",  # uses simdutf8 + fast SHA1 without unsafe AVX
    "worktree-mutation",     # enables index/worktree status APIs
], optional = true }


# System info & PC Diagnostics (Phase 2 prompt / Phase 4 tools / pc-info)
sysinfo = { version = "0.32", optional = true }
battery = { version = "0.7.8", optional = true }
raw-cpuid = { version = "11.1", optional = true }
nvml-wrapper = { version = "0.13", optional = true }

# Interactive prompts (Phase 4 tools: uup, uu)
inquire = { version = "0.9", optional = true }

# Terminal UI & Raw Mode (Phase 4 native TUI tools)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
unicode-width = "0.2"

# Fast Grep Engine (ripgrep crates)
ignore = { version = "0.4", optional = true }
grep-regex = { version = "0.1", optional = true }
grep-searcher = { version = "0.1", optional = true }
grep-printer = { version = "0.3", optional = true }
termcolor = { version = "1.4", optional = true }

# Directory walking (Phase 4 tools: ex, makecpp)
walkdir = { version = "2", optional = true }

# Native cross-platform clipboard (X11 + Wayland + macOS — zero external binary)
arboard = { version = "3", optional = true }

# String rendering helpers (zero-alloc ANSI)
# We use the `ansi_term` crate only for the binary; the cdylib uses raw bytes.
ansi_term = { version = "0.12", optional = true }

# Pure Rust Cryptography & Vault Archiving Dependencies (Zero external binary)
aes-gcm = { version = "0.10", optional = true }
pbkdf2 = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }
zeroize = { version = "1.8", features = ["zeroize_derive"], optional = true }
rpassword = { version = "7.3", optional = true }
rand = { version = "0.9", optional = true }
rand_chacha = { version = "0.9", optional = true }
ureq = { version = "2.12", optional = true }
open = { version = "5.3", optional = true }

# Data parallelism — parallel metric collection & file search
rayon = { version = "1.10", optional = true }

# Windows WMI Hardware Diagnostics & Console APIs
[target.'cfg(target_os = "windows")'.dependencies]
wmi         = "0.18"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# Unix Raw Mode termios handling
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ── Feature Flags ─────────────────────────────────────────────────────────────
[features]
default = ["prompt-engine", "tools"]
# Enable heavy Phase-2 prompt engine (git + async)
prompt-engine = ["gix", "git2", "rayon"]

# Enable Phase-4 tool subcommands & pc-info diagnostics
tools = [
    "sysinfo",
    "battery",
    "raw-cpuid",
    "nvml-wrapper",
    "inquire",
    "ratatui",
    "crossterm",
    "walkdir",
    "ansi_term",
    "arboard",
    "ignore",
    "grep-regex",
    "grep-searcher",
    "grep-printer",
    "termcolor",
    "aes-gcm",
    "pbkdf2",
    "sha2",
    "tar",
    "flate2",
    "zeroize",
    "rpassword",
    "rand",
    "rand_chacha",
    "ureq",
    "open",
    "rayon",
]
# Convenience: all features

full = ["prompt-engine", "tools"]

# ── Release Profile (strict performance constraints) ──────────────────────────
# Cold Startup ≤ 25 ms | Prompt < 1 ms | 0 forks | RSS ≤ 3.9 MB
[profile.release]
opt-level     = 3          # Maximum speed optimisation
lto           = true       # Whole-program link-time optimisation (thin by default; use "fat" for max)
codegen-units = 1          # Single CGU → best inlining & dead-code elimination
panic         = "abort"    # No unwinding machinery → smaller binary, faster panics
strip         = true       # Strip debug symbols → minimal RSS
debug         = false
overflow-checks = true     # Enforce overflow checks in release profile
incremental   = false      # Disable incremental saves (incompatible with LTO=fat)


# Aggressive fat LTO for the absolute smallest / fastest artefact
# Uncomment when you are doing a final production build:
# lto = "fat"

# ── Dev Profile ──────────────────────────────────────────────────────────────
[profile.dev]
opt-level = 1              # Faster compile, still debuggable
debug     = true

# ── Dev Dependencies (benchmarks / tests only) ────────────────────────────────
[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

# ── Benchmark Targets ─────────────────────────────────────────────────────────
[[bench]]
name    = "bench_prompt"
harness = false

[[bench]]
name    = "bench_aliases"
harness = false

[[bench]]
name    = "bench_secret_gen"
harness = false

[[bench]]
name    = "bench_git"
harness = false

# ── Test / Bench profiles ────────────────────────────────────────────────────
[profile.test]
opt-level = 1

[profile.bench]
opt-level     = 3
lto           = true
codegen-units = 1
