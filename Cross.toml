# Cross.toml — Configuration for `cross` cross-compilation tool
# https://github.com/cross-rs/cross/wiki/Configuration
#
# arboard (clipboard) requires X11/Wayland C dev-headers at compile time on Linux.
# The aarch64-gnu target uses Debian multiarch to install arm64 dev headers.
# The aarch64-musl target uses a custom Alpine image (musl-native X11 libs via apk).

# ── aarch64 GNU ──────────────────────────────────────────────────────────────
# cross base image: ghcr.io/cross-rs/aarch64-unknown-linux-gnu (Debian-based)
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update -qq",
    "apt-get install -y --no-install-recommends libxcb1-dev:arm64 libxcb-render0-dev:arm64 libxcb-shape0-dev:arm64 libxcb-xfixes0-dev:arm64 libxkbcommon-dev:arm64 libwayland-dev:arm64",
]

# ── aarch64 MUSL ─────────────────────────────────────────────────────────────
# musl targets cannot use glibc-linked X11 libs; use a custom Alpine image
# where musl is the native libc and X11 headers are musl-compatible.
[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"
pre-build = [
    "apk add --no-cache libxcb-dev xcb-util-dev libxkbcommon-dev wayland-dev",
]
