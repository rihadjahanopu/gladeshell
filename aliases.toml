# ── Editor & Config ──────────────────────────────────────────────────────────
[[group]]
name = "Editor & Config"

[[group.aliases]]
key         = "to"
value       = "code ."
description = "Open current directory in VS Code"

[[group.aliases]]
key         = "vm"
value       = "vim ."
description = "Open current directory in Vim"

[[group.aliases]]
key         = "nv"
value       = "nvim ."
description = "Open current directory in Neovim"

[[group.aliases]]
key         = "zed"
value       = "zed ."
description = "Open current directory in Zed"

[[group.aliases]]
key         = "zshrc"
value       = "code ~/.zshrc"
description = "Edit Zsh config in VS Code"
only_shells = ["zsh"]

[[group.aliases]]
key         = "bashrc"
value       = "code ~/.bashrc"
description = "Edit Bash config in VS Code"
only_shells = ["bash"]

[[group.aliases]]
key         = "rel"
value       = "pkill -f gladeshell-daemon 2>/dev/null; rm -f /tmp/gladeshell_*.sock(N) 2>/dev/null; source ~/.zshrc; echo \"🔄 Zsh reloaded!\""
description = "Reload Zsh config"
only_shells = ["zsh"]

[[group.aliases]]
key         = "rel"
value       = "pkill -f gladeshell-daemon 2>/dev/null; rm -f /tmp/gladeshell_*.sock 2>/dev/null; source ~/.bashrc; echo \"🔄 Bash reloaded!\""
description = "Reload Bash config"
only_shells = ["bash"]

[[group.aliases]]
key         = "rel"
value       = "pkill -f gladeshell-daemon 2>/dev/null; sh -c 'rm -f /tmp/gladeshell_*.sock 2>/dev/null'; source ~/.config/fish/config.fish; echo \"🔄 Fish reloaded!\""
description = "Reload Fish config"
only_shells = ["fish"]

[[group.aliases]]
key         = "rel"
value       = ". $PROFILE; Write-Host \"🔄 PowerShell reloaded!\""
description = "Reload PowerShell config"
only_shells = ["pwsh"]

