# =============================================================================
#  aliases.toml — Centralized static alias repository for gladeshell
#
#  Schema:
#    [[group]]
#    name = "Category Name"
#    only_shells = ["bash", "zsh"]   # optional: omit for all shells
#
#    [[group.aliases]]
#    key         = "alias_name"
#    value       = "full command string"
#    description = "Optional human-readable description"
#
#  This file is the SINGLE SOURCE OF TRUTH for all shell aliases.
#  Run `gladeshell init <shell>` to regenerate shell-specific output.
# =============================================================================

# ── Navigation & Filesystem ──────────────────────────────────────────────────
[[group]]
name = "Navigation & Filesystem"

[[group.aliases]]
key         = "c"
value       = "clear"
description = "Clear terminal screen"

[[group.aliases]]
key         = "cls"
value       = "clear"
description = "Clear terminal screen (Windows-style alias)"

[[group.aliases]]
key         = ".."
value       = "cd .."
description = "Go up one directory"

[[group.aliases]]
key         = "..."
value       = "cd ../.."
description = "Go up two directories"

[[group.aliases]]
key         = "...."
value       = "cd ../../.."
description = "Go up three directories"

[[group.aliases]]
key         = "....."
value       = "cd ../../../.."
description = "Go up four directories"

[[group.aliases]]
key         = "root"
value       = "cd /"
description = "Jump to filesystem root"

[[group.aliases]]
key         = "h"
value       = "history"
description = "Show command history"

[[group.aliases]]
key         = "path"
value       = "echo $PATH | tr ':' '\\n'"
description = "Display PATH entries line-by-line"
only_shells = ["bash", "zsh"]

[[group.aliases]]
key         = "path"
value       = "$env:PATH -split ';'"
description = "Display PATH entries line-by-line"
only_shells = ["pwsh"]

