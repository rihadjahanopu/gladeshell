<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient Border -->
    <linearGradient id="grad-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Cyan Bolt -->
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="#0b1120" stroke="url(#grad-border)" stroke-width="12" />

  <!-- Lightning Bolt Path with Terminal Prompt inside -->
  <path d="M 285 70 
           L 180 260 
           L 260 260 
           L 210 440 
           L 345 230 
           L 260 230 
           Z" 
        fill="none" 
        stroke="url(#bolt-grad)" 
        stroke-width="16" 
        stroke-linejoin="round" 
        stroke-linecap="round"
        filter="url(#glow)" />

  <!-- Prompt >_ inside bolt head -->
  <path d="M 240 135 L 260 150 L 240 165" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="268" y1="165" x2="288" y2="165" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
</svg>
